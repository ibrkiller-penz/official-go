name: Deploy haeundae-kim (Firebase Hosting)

# 서비스 계정 키 발급이 조직 정책으로 막혀 있어, 자동 배포는 수동 실행만 허용합니다.
# 키가 준비되면 push 트리거를 다시 추가하세요.
on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kim-mia-site/package-lock.json

      - name: Install and build
        working-directory: kim-mia-site
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: person-park
          channelId: live
          entryPoint: ./kim-mia-site
