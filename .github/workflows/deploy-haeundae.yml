name: Deploy haeundae-kim (Firebase Hosting)

on:
  push:
    branches:
      - claude/bold-bardeen-vx5k4i
    paths:
      - 'kim-mia-site/**'
      - '.github/workflows/deploy-haeundae.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kim-mia-site/package-lock.json

      - name: Install and build
        working-directory: kim-mia-site
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: person-park
          channelId: live
          entryPoint: ./kim-mia-site
